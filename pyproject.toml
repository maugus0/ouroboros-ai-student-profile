[project]
name = "ouroboros-ai-student-profile"
version = "0.1.0"
description = "Student Profile Agent microservice for document parsing and profile extraction"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "aiomysql>=0.2.0",
  "mysql-connector-python>=9.1.0",
  "openai>=1.59.0",
  "anthropic>=0.48.0",
  "pdfplumber>=0.11.0",
  "python-docx>=1.1.0",
  "Pillow>=11.0.0",
  "pytesseract>=0.3.13",
  "httpx>=0.27.2",
  "tenacity>=9.0.0",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.6.0",
  "structlog>=24.4.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "black>=24.8.0",
  "isort>=5.13.2",
  "flake8>=7.1.1",
  "pylint>=3.3.1",
  "mypy>=1.11.2",
  "bandit>=1.7.10",
  "safety>=3.2.11",
]

[tool.uv]
package = false

[tool.black]
line-length = 120
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | env
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip_gitignore = false
known_first_party = ["app"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = false
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
  "ignore::DeprecationWarning",
]
